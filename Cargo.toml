[workspace]
resolver = "3"
members = [
    "cli",
    "dock-ui",
    "app",
    "audio",
    "emotes-bttv",
    "emotes-ffz",
    "emotes-7tv",
    "messages",
    "messages-twitch",
    "obs",
    "obs-sys",
    "configuration",
    "persistence",
    "runtime",
    "ui-protocol",
    "secrets",
    "tts",
    "tts-macos",
    "tts-openai",
    "tts-parler",
    "xtask",
]
default-members = [
    "app",
]
exclude = ["vendor"]

[workspace.package]
# use 0.0.1 to mark as extremely experimental
version = "0.0.1"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
# local crates
lupo-audio = { path = "audio", default-features = false }
lupo-configuration.path = "configuration"
lupo-persistence.path = "persistence"
lupo-runtime.path = "runtime"
lupo-ui-protocol.path = "ui-protocol"
lupo-obs-sys.path = "obs-sys"
lupo-secrets.path = "secrets"
lupo-tts.path = "tts"
lupo-tts-openai.path = "tts-openai"
lupo-tts-macos.path = "tts-macos"
lupo-tts-parler.path = "tts-parler"
messages-twitch.path = "messages-twitch"
emotes-7tv.path = "emotes-7tv"
emotes-ffz.path = "emotes-ffz"
emotes-bttv.path = "emotes-bttv"
messages.path = "messages"

# twitch API
barbed = "0.0.5"


# dioxus
dioxus = "0.7"
dioxus-desktop = "0.7"
dioxus-native = "0.7"

# General
url = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = { version = "6", path = "vendor/directories-rs" }
anyhow = "1"
iddqd = "0.5"
smallvec = "1"
bitflags = "2"
thiserror = "2"
once_cell = "1"
time = { version = "0.3", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
unicode-segmentation = "1"
emojis = "0.9"
#console-subscriber = "0.5"
#keyring = "4.0.0-rc.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
which = "8"
bindgen = "0.73"
axum = { version = "0.8", features = ["ws"] }
gloo-net = { version = "0.7", default-features = false, features = ["websocket"] }
gloo-timers = { version = "0.4", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }
wasm-bindgen-cli-support = "0.2.130"
rand = "0.10"
arboard = { version = "3", default-features = false }
cc = "1"
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
futures-util = "0.3"

# async
tokio = { version = "1", features = ["full", "tracing"] }
async-channel = "2"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-error = "0.2"

# http
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "form", "query"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "native-tls", "pkce-plain"] }
webbrowser = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

# audio
rodio = { version = "0.23", default-features = false, features = ["tracing", "symphonia-all"] }

# database
redb = "4"

# wasm
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

# huggingface
candle-core = "0.11"
candle-transformers = "0.11"
candle-nn = "0.11"
hf-hub = { version = "1.0", features = ["blocking"] }
safetensors = "0.8"
tokenizers = "0.23"
hound = "3.5"

# macOS specific
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-avf-audio = "0.3"
block2 = "0.6"
dispatch = "0.2"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# The OBS plugin is loaded into a host process: a panic must never abort OBS,
# so it keeps unwinding and catches at every FFI boundary instead.
[profile.obs-release]
inherits = "release"
panic = "unwind"


[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = 3 # Prioritizes speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
