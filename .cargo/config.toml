[build]
rustflags = ["-C", "target-cpu=native"]

[alias]
xtask = "run --release --package xtask --"
dev-build-lupo = "xtask dev-build --bin lupo"
dev-build-lupo-cli = "xtask dev-build --bin lupo-cli"
dev-run-lupo = "xtask dev-run --bin lupo"
dev-run-lupo-cli = "xtask dev-run --bin lupo-cli"
obs-install = "xtask bundle-obs --install"

[target.wasm32-unknown-unknown]
rustflags = []
