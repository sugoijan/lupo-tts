[package]
name = "lupo-app"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "lupo"
path = "src/main.rs"

[features]
default = ["renderer-webview"]
renderer-native = ["dep:dioxus-native"]
renderer-webview = ["dep:dioxus-desktop"]

[dependencies]
dioxus.workspace = true
dioxus-desktop = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }
lupo-runtime.workspace = true
lupo-audio = { workspace = true, features = ["device"] }
lupo-persistence.workspace = true
lupo-tts.workspace = true
lupo-configuration.workspace = true
lupo-secrets.workspace = true
messages.workspace = true
url.workspace = true
serde_json.workspace = true
directories.workspace = true
tokio.workspace = true
async-channel.workspace = true
tracing.workspace = true
time.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
tempfile.workspace = true
