[package]
name = "lupo-app"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "lupo"
path = "src/main.rs"

[lib]
# Make the lib name unique so it doesn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lupo_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = ["config-toml"] }

[dependencies]
lupo-audio = { path = "../audio" }
lupo-migrator = { path = "../migrator" }
lupo-models = { path = "../models" }
lupo-tts = { path = "../tts" }
lupo-tts-openai = { path = "../tts-openai" }

tauri = { version = "2", features = ["config-toml", "tracing", "native-tls"] }
tauri-plugin-log = { version = "2", features = [ "colored", "tracing" ] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
iddqd = "0.3"
fern = { version = "0.7", features = ["chrono", "colored"] }
smallvec = "1"
thiserror = "2"
console-subscriber = "0.4"
tokio = { version = "1", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-error = "0.2"
keyring = "4.0.0-rc.1"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "debug-print"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
