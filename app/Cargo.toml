[package]
name = "lupo-app"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "lupo"
path = "src/main.rs"

[features]
default = ["renderer-webview"]
renderer-native = ["dep:dioxus-native"]
renderer-webview = ["dep:dioxus-desktop"]

[dependencies]
dioxus.workspace = true
dioxus-desktop = { workspace = true, optional = true }
dioxus-native = { workspace = true, optional = true }
lupo-audio.workspace = true
lupo-persistence.workspace = true
lupo-tts.workspace = true
lupo-tts-openai.workspace = true
lupo-tts-parler.workspace = true
lupo-configuration.workspace = true
lupo-secrets.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
anyhow.workspace = true
iddqd.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tracing-log.workspace = true
tracing-error.workspace = true
messages.workspace = true
messages-twitch.workspace = true
emotes-7tv.workspace = true
emotes-bttv.workspace = true
emotes-ffz.workspace = true
reqwest.workspace = true
time.workspace = true
unicode-segmentation.workspace = true
async-channel = "2"
sha2.workspace = true
hex.workspace = true
hound.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "=21.0.0"
lupo-tts-macos.workspace = true

[dev-dependencies]
rustls.workspace = true
tempfile.workspace = true
