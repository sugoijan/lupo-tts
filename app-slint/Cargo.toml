[package]
name = "lupo-app-slint"
version.workspace = true
license.workspace = true
edition.workspace = true

[[bin]]
name = "lupo"
path = "src/main.rs"

[lib]
# Make the lib name unique so it doesn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lupo_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
slint-build = "1.14"

[dependencies]
lupo-audio.workspace = true
lupo-migrator.workspace = true
lupo-models.workspace = true
lupo-tts.workspace = true
lupo-tts-openai.workspace = true
slint.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
anyhow.workspace = true
iddqd.workspace = true
fern.workspace = true
smallvec.workspace = true
thiserror.workspace = true
#console-subscriber.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tracing-log.workspace = true
tracing-error.workspace = true
#keyring.workspace = true
sea-orm.workspace = true
naga = { version = "27.0.3", features = ["termcolor"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true
